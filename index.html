<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Analyzer App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0f121a]">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- ชุดข้อมูลไพ่มาตรฐาน ---
        const suits = ['♠', '♣', '♥', '♦'];
        const ranks = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
        const DECK = ranks.flatMap(rank => suits.map(suit => ({ rank, suit, id: `${rank}${suit}` })));

        const PokerAnalyzerApp = () => {
          const [boardCards, setBoardCards] = useState([]); 
          const [heroCards, setHeroCards] = useState([]);   
          const [betSize, setBetSize] = useState(50);      
          const [activeSelection, setActiveSelection] = useState('board'); 

          // ปุ่ม Bet Size 
          const sizes = [5, 10, 25, 33, 50, 75, 90, 100];

          // คำนวณ Pot Odds อัตโนมัติ 
          const potOdds = useMemo(() => {
            const callAmount = betSize;
            const totalPotAfterCall = 100 + betSize + callAmount;
            return ((callAmount / totalPotAfterCall) * 100).toFixed(1);
          }, [betSize]);

          // ฟังก์ชันเลือกไพ่ 
          const handleCardClick = (card) => {
            const alreadySelected = [...boardCards, ...heroCards].some(c => c.id === card.id);
            if (alreadySelected) return;

            if (activeSelection === 'board' && boardCards.length < 5) {
              setBoardCards([...boardCards, card]);
            } else if (activeSelection === 'hero' && heroCards.length < 2) {
              setHeroCards([...heroCards, card]);
            }
          };

          const removeCard = (type, id) => {
            if (type === 'board') setBoardCards(boardCards.filter(c => c.id !== id));
            if (type === 'hero') setHeroCards(heroCards.filter(c => c.id !== id));
          };

          return (
            <div className="min-h-screen bg-[#0f121a] text-white p-4 font-sans">
              <div className="max-w-md mx-auto space-y-4">
                
                {/* --- ส่วนที่ 1: BOARD CARDS --- */}
                <div className={`p-4 rounded-xl border transition-all ${activeSelection === 'board' ? 'border-orange-500/50 bg-[#1a1f2e] shadow-lg' : 'border-gray-800 bg-[#151924]'}`}
                     onClick={() => setActiveSelection('board')}>
                  <h3 className="text-[10px] uppercase tracking-widest text-gray-400 mb-2">Board Cards (3-5)</h3>
                  <div className="flex gap-2 mb-4">
                    {[0, 1, 2, 3, 4].map(i => (
                      <div key={i} className="w-12 h-16 border border-dashed border-gray-600 rounded flex items-center justify-center relative bg-gray-900/50">
                        {boardCards[i] ? (
                          <div className={`text-lg font-bold ${['♥','♦'].includes(boardCards[i].suit) ? 'text-red-500' : 'text-white'}`}>
                            {boardCards[i].id}
                            <button onClick={(e) => { e.stopPropagation(); removeCard('board', boardCards[i].id); }} 
                                    className="absolute -top-1 -right-1 bg-red-500 rounded-full w-4 h-4 text-[8px] flex items-center justify-center hover:bg-red-600">X</button>
                          </div>
                        ) : <span className="text-gray-700">+</span>}
                      </div>
                    ))}
                  </div>
                  
                  <div className="flex flex-wrap gap-1 justify-center border-t border-gray-800 pt-3">
                    {DECK.map(card => {
                      const isUsed = [...boardCards, ...heroCards].some(c => c.id === card.id);
                      return (
                        <button key={card.id} disabled={isUsed} onClick={() => handleCardClick(card)}
                                className={`w-[26px] h-9 rounded text-[9px] font-bold transition-all ${isUsed ? 'opacity-10 bg-black cursor-not-allowed' : 'bg-gray-800 hover:bg-gray-700 hover:scale-110 active:scale-95'}`}>
                          <span className={['♥','♦'].includes(card.suit) ? 'text-red-400' : 'text-white'}>{card.id}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* --- ส่วนที่ 2: HERO'S HOLE CARDS --- */}
                <div className={`p-4 rounded-xl border transition-all ${activeSelection === 'hero' ? 'border-orange-500/50 bg-[#1a1f2e] shadow-lg' : 'border-gray-800 bg-[#151924]'}`}
                     onClick={() => setActiveSelection('hero')}>
                  <h3 className="text-[10px] uppercase tracking-widest text-gray-400 mb-2">Hero's Hole Cards</h3>
                  <div className="flex gap-2 mb-4">
                    {[0, 1].map(i => (
                      <div key={i} className="w-12 h-16 border border-dashed border-gray-600 rounded flex items-center justify-center relative bg-gray-900/50">
                        {heroCards[i] ? (
                          <div className={`text-lg font-bold ${['♥','♦'].includes(heroCards[i].suit) ? 'text-red-500' : 'text-white'}`}>
                            {heroCards[i].id}
                            <button onClick={(e) => { e.stopPropagation(); removeCard('hero', heroCards[i].id); }} 
                                    className="absolute -top-1 -right-1 bg-red-500 rounded-full w-4 h-4 text-[8px] flex items-center justify-center hover:bg-red-600">X</button>
                          </div>
                        ) : <span className="text-gray-700">+</span>}
                      </div>
                    ))}
                  </div>
                  
                  <div className="flex flex-wrap gap-1 justify-center border-t border-gray-800 pt-3">
                    {DECK.map(card => {
                      const isUsed = [...boardCards, ...heroCards].some(c => c.id === card.id);
                      return (
                        <button key={card.id} disabled={isUsed} onClick={() => handleCardClick(card)}
                                className={`w-[26px] h-9 rounded text-[9px] font-bold transition-all ${isUsed ? 'opacity-10 bg-black cursor-not-allowed' : 'bg-gray-800 hover:bg-gray-700 hover:scale-110 active:scale-95'}`}>
                          <span className={['♥','♦'].includes(card.suit) ? 'text-red-400' : 'text-white'}>{card.id}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* --- ส่วนที่ 3: OPPONENT'S BET SIZE --- */}
                <div className="bg-[#1a1f2e] p-5 rounded-xl border border-blue-900/30 shadow-lg">
                  <h3 className="text-gray-400 text-[10px] uppercase font-bold mb-4">Opponent's Bet Size</h3>
                  <div className="grid grid-cols-4 gap-2 mb-6">
                    {sizes.map((size) => (
                      <button key={size} onClick={() => setBetSize(size)}
                        className={`py-3 rounded-lg text-sm font-bold transition-all ${
                          betSize === size ? 'border-2 border-orange-400 text-orange-400 shadow-[0_0_10px_rgba(251,146,60,0.3)] bg-orange-900/10' : 'bg-blue-900/20 text-gray-500 hover:bg-blue-900/40 border-2 border-transparent'
                        }`}>
                        {size}%
                      </button>
                    ))}
                    <button className="bg-red-900/20 border-2 border-transparent hover:border-red-500/50 py-3 rounded-lg text-sm font-bold text-red-400 transition-all">All-in</button>
                  </div>

                  <div className="flex justify-between items-center bg-[#0f121a] p-3 rounded-lg border border-gray-800">
                    <div>
                      <p className="text-gray-500 text-[10px] uppercase tracking-wider">Pot Odds</p>
                      <p className="text-orange-400 text-xl font-black">{potOdds}%</p>
                    </div>
                    <div className="text-right">
                      <p className="text-gray-500 text-[10px] uppercase tracking-wider">Min Equity needed</p>
                      <p className="text-orange-400 text-xl font-black">{potOdds}%</p>
                    </div>
                  </div>
                </div>

                {/* --- ปุ่ม ANALYZE RANGE --- */}
                <button className="w-full mt-4 bg-orange-500 hover:bg-orange-600 text-[#0f121a] font-black py-4 rounded-xl text-lg uppercase tracking-widest shadow-[0_0_15px_rgba(249,115,22,0.4)] active:scale-95 transition-all">
                  Analyze Range
                </button>

              </div>
            </div>
          );
        };

        // สั่งให้ React เรนเดอร์แอปไปที่ div id="root"
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PokerAnalyzerApp />);
    </script>
</body>
</html>
